# Server and dump images to ghcr.io/<owner>/avledet(-dump), without game data
name: docker

on:
  push:
    branches: [port-1.0]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/avledet:latest
          # the vcpkg layers take most of the build time
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: port/docker/dump.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/avledet-dump:latest
          cache-from: type=gha,scope=dump
          cache-to: type=gha,mode=max,scope=dump,ignore-error=true
